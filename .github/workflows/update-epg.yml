name: Update EPG

on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-epg:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Download EPG
        shell: bash
        run: |
          set -euo pipefail

          URL="http://epg.one/epg2.xml.gz"
          TEMP="epg.xml.gz.tmp"

          echo "Downloading EPG from $URL"

          rm -f "$TEMP"

          curl \
            --location \
            --fail \
            --silent \
            --show-error \
            --retry 5 \
            --retry-delay 5 \
            --connect-timeout 30 \
            --max-time 300 \
            --output "$TEMP" \
            "$URL"

          echo "Downloaded file:"
          ls -lh "$TEMP"

          if [ ! -s "$TEMP" ]; then
            echo "ERROR: EPG file is empty!"
            exit 1
          fi

          echo "Checking gzip..."

          if ! gzip -t "$TEMP"; then
            echo "ERROR: Invalid gzip archive!"
            exit 1
          fi

          echo "GZIP check: OK"

          mv "$TEMP" epg.xml.gz

          echo "EPG successfully downloaded."

      - name: Commit and push EPG
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add epg.xml.gz

          if git diff --cached --quiet; then
            echo "EPG has not changed."
            exit 0
          fi

          git commit -m "Update EPG"
          git push

          echo "EPG successfully committed and pushed."
