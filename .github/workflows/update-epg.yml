name: Update EPG

on:
  schedule:
    # Оновлення кожні 6 годин
    - cron: '17 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-epg:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Download EPG
        shell: bash
        run: |
          set -euo pipefail

          URL="http://epg.one/epg.xml.gz"
          TEMP="epg.xml.gz.tmp"
          OUTPUT="epg.xml.gz"

          echo "======================================"
          echo "Downloading EPG"
          echo "URL: $URL"
          echo "======================================"

          rm -f "$TEMP"

          curl \
            --location \
            --fail \
            --silent \
            --show-error \
            --retry 5 \
            --retry-delay 5 \
            --connect-timeout 30 \
            --max-time 300 \
            --output "$TEMP" \
            "$URL"

          echo
          echo "Downloaded file:"
          ls -lh "$TEMP"

          # Перевірка, що файл не порожній
          if [ ! -s "$TEMP" ]; then
            echo "ERROR: Downloaded EPG file is empty!"
            rm -f "$TEMP"
            exit 1
          fi

          # Перевірка gzip
          echo
          echo "Checking gzip archive..."

          if ! gzip -t "$TEMP"; then
            echo "ERROR: Downloaded file is NOT a valid gzip archive!"
            rm -f "$TEMP"
            exit 1
          fi

          echo "GZIP check: OK"

          # Перевірка XMLTV без pipe/head,
          # щоб не отримувати Broken pipe
          echo
          echo "Checking XMLTV content..."

          gzip -cd "$TEMP" > epg.xml.check

          if grep -q "<tv" epg.xml.check; then
            echo "XMLTV check: OK"
          else
            echo "ERROR: Downloaded archive does not appear to contain XMLTV data!"
            rm -f "$TEMP" epg.xml.check
            exit 1
          fi

          # Видаляємо тимчасовий розпакований XML
          rm -f epg.xml.check

          # Атомарна заміна старого EPG
          mv "$TEMP" "$OUTPUT"

          echo
          echo "======================================"
          echo "EPG successfully updated."
          echo "======================================"

      - name: Check for changes
        id: changes
        shell: bash
        run: |
          set -euo pipefail

          if git diff --quiet -- epg.xml.gz; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "EPG has NOT changed."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "EPG has changed."
          fi

      - name: Commit and push
        if: steps.changes.outputs.changed == 'true'
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add epg.xml.gz

          git commit -m "Update EPG"

          git push

          echo "EPG successfully committed and pushed."

      - name: Nothing to update
        if: steps.changes.outputs.changed == 'false'
        run: |
          echo "EPG is already up to date."
