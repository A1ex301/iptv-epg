name: Update EPG

on:
  schedule:
    # Оновлення кожні 6 годин
    - cron: '17 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-epg:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download EPG
        run: |
          set -e

          URL="http://epg.one/epg.xml.gz"
          TEMP="epg.xml.gz.tmp"

          echo "Downloading EPG from $URL..."

          curl -L --fail --retry 3 --connect-timeout 30 \
            -o "$TEMP" "$URL"

          echo "Downloaded file size:"
          ls -lh "$TEMP"

          # Перевіряємо, що це справді gzip
          if ! gzip -t "$TEMP"; then
            echo "ERROR: Downloaded file is not a valid gzip archive!"
            exit 1
          fi

          # Перевіряємо, що файл не порожній
          if [ ! -s "$TEMP" ]; then
            echo "ERROR: Downloaded file is empty!"
            exit 1
          fi

          mv "$TEMP" epg.xml.gz

          echo "EPG successfully updated."

      - name: Check for changes
        id: changes
        run: |
          if git diff --quiet -- epg.xml.gz; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "EPG has not changed."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "EPG has changed."
          fi

      - name: Commit and push
        if: steps.changes.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add epg.xml.gz
          git commit -m "Update EPG"
          git push
